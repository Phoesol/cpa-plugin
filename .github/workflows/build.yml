# Multi-arch CPA plugin build & release (workbuddy + qoderwork).
# Asset naming matches CLIProxyAPI pluginstore ArchiveName():
#   <id>_<version>_<goos>_<goarch>.zip
# Zip root must contain: <id>.so | <id>.dylib | <id>.dll
# Plus: checksums.txt
#
# Platforms (aligned with official CPA plugins):
#   linux/amd64, linux/arm64
#   darwin/amd64, darwin/arm64
#   windows/amd64, windows/arm64 (via go-cross)
#   freebsd/amd64 (via go-cross)
#
# Release trigger: tag 'v*' (builds BOTH plugins at that version)
# or workflow_dispatch with explicit version.

name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v (empty = per-plugin VERSION file or tag)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.dir }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: workbuddy
          - dir: qoderwork
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache-dependency-path: ${{ matrix.dir }}/go.sum
      - name: Validate registry.json
        working-directory: .
        run: python3 scripts/validate-registry.py registry.json
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  build:
    name: ${{ matrix.id }} ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # workbuddy
          - id: workbuddy
            goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
          - id: workbuddy
            goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - id: workbuddy
            goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: dylib
          - id: workbuddy
            goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
          - id: workbuddy
            goos: windows
            goarch: amd64
            runner: windows-2025
            ext: dll
          # qoderwork
          - id: qoderwork
            goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
          - id: qoderwork
            goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - id: qoderwork
            goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: dylib
          - id: qoderwork
            goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
          - id: qoderwork
            goos: windows
            goarch: amd64
            runner: windows-2025
            ext: dll
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.id }}/go.mod
          cache-dependency-path: ${{ matrix.id }}/go.sum

      - name: Resolve release metadata
        working-directory: .
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(tr -d ' \n\r' < ${{ matrix.id }}/VERSION)"
            if [[ "${GITHUB_REF_TYPE:-}" != "tag" && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
              VERSION="${VERSION}+ci.${GITHUB_RUN_NUMBER}"
            fi
          fi
          CLEAN_VERSION="${VERSION%%+*}"
          echo "VERSION=${CLEAN_VERSION}" >> "${GITHUB_ENV}"
          echo "LIB_NAME=${{ matrix.id }}.${{ matrix.ext }}" >> "${GITHUB_ENV}"
          echo "ARCHIVE_NAME=${{ matrix.id }}_${CLEAN_VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" >> "${GITHUB_ENV}"
          echo "version=${CLEAN_VERSION} archive=${{ matrix.id }}_${CLEAN_VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"

      - name: Build shared library
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -buildmode=c-shared \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${LIB_NAME}" .
          rm -f "dist/${{ matrix.id }}.h" dist/*.h || true
          file "dist/${LIB_NAME}" || true

      - name: Package plugin (CPA ArchiveName)
        working-directory: .
        run: |
          set -euo pipefail
          go run ./.github/scripts/package-release.go \
            -library "${{ matrix.id }}/dist/${LIB_NAME}" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"
          python3 - <<'PY'
          import zipfile, os, sys
          name = os.environ["ARCHIVE_NAME"]
          lib = os.environ["LIB_NAME"]
          with zipfile.ZipFile(name) as z:
              names = z.namelist()
              print("zip entries:", names)
              if lib not in names:
                  sys.exit(f"zip root missing {lib}: {names}")
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  build-cross:
    name: ${{ matrix.id }} ${{ matrix.target }} (go-cross)
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: workbuddy
            target: windows-arm64
            ext: dll
          - id: workbuddy
            target: freebsd-amd64
            ext: so
          - id: qoderwork
            target: windows-arm64
            ext: dll
          - id: qoderwork
            target: freebsd-amd64
            ext: so
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.id }}/go.mod
          cache-dependency-path: ${{ matrix.id }}/go.sum

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(tr -d ' \n\r' < ${{ matrix.id }}/VERSION)"
            VERSION="${VERSION%%+*}"
          fi
          CLEAN_VERSION="${VERSION%%+*}"
          GOOS="${{ matrix.target }}"
          GOARCH_PART="${GOOS#*-}"
          GOOS_PART="${GOOS%-*}"
          echo "VERSION=${CLEAN_VERSION}" >> "${GITHUB_ENV}"
          echo "version=${CLEAN_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "ARCHIVE_NAME=${{ matrix.id }}_${CLEAN_VERSION}_${GOOS_PART}_${GOARCH_PART}.zip" >> "${GITHUB_ENV}"
          echo "LIB_NAME=${{ matrix.id }}.${{ matrix.ext }}" >> "${GITHUB_ENV}"

      - name: Build cross shared library
        timeout-minutes: 45
        uses: go-cross/cgo-actions@v1
        env:
          GOFLAGS: -trimpath -buildmode=c-shared
        with:
          dir: ${{ matrix.id }}
          packages: .
          targets: ${{ matrix.target }}
          out-dir: dist/${{ matrix.target }}
          output: ${{ env.LIB_NAME }}
          flags: -ldflags=-s -w
          x-flags: main.version=${{ steps.meta.outputs.version }}

      - name: Package plugin
        run: |
          set -euo pipefail
          rm -f go-cross-bin.h "${{ matrix.id }}/dist/${{ matrix.target }}/${{ matrix.id }}.h" || true
          LIB=""
          for p in \
            "${{ matrix.id }}/dist/${{ matrix.target }}/${LIB_NAME}" \
            "dist/${{ matrix.target }}/${LIB_NAME}" \
            "${{ matrix.id }}/dist/${LIB_NAME}"; do
            if [ -f "$p" ]; then LIB="$p"; break; fi
          done
          if [ -z "$LIB" ]; then
            echo "library not found"; find . -name '*.dll' -o -name '*.so' | head
            exit 1
          fi
          go run ./.github/scripts/package-release.go \
            -library "${LIB}" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
    needs:
      - build
      - build-cross
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble checksums.txt
        run: |
          set -euo pipefail
          ls -la dist/
          if ls dist/*.sha256 >/dev/null 2>&1; then
            sort dist/*.sha256 > dist/checksums.txt
          else
            (cd dist && sha256sum *.zip > checksums.txt)
          fi
          cat dist/checksums.txt
          V="${{ steps.meta.outputs.version }}"
          for id in workbuddy qoderwork; do
            test -f "dist/${id}_${V}_linux_amd64.zip"
            test -f "dist/${id}_${V}_linux_arm64.zip"
            test -f "dist/${id}_${V}_darwin_amd64.zip"
            test -f "dist/${id}_${V}_darwin_arm64.zip"
            test -f "dist/${id}_${V}_windows_amd64.zip"
            test -f "dist/${id}_${V}_windows_arm64.zip"
          done

      - name: Sync registry.json version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          v = os.environ["VERSION"]
          p = pathlib.Path("registry.json")
          data = json.loads(p.read_text())
          for plug in data.get("plugins", []):
              plug["version"] = v
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          print(p.read_text())
          PY
          python3 scripts/validate-registry.py registry.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              git tag -a "${TAG}" -m "Release ${TAG}"
              git push origin "${TAG}"
            fi
          fi
          NOTES=$(cat <<EOF
          ## CPA plugins v${VERSION} (workbuddy + qoderwork)

          Multi-arch builds for [CLIProxyAPI](https://github.com/router-for-me/CLIProxyAPI) plugin store (\`github-release\` install type).

          ### Assets (pluginstore \`ArchiveName(id, version, goos, goarch)\`)
          Each zip contains the bare library at its root:
          \`<id>.so\` (linux/freebsd), \`<id>.dylib\` (darwin), \`<id>.dll\` (windows).

          Platforms per plugin: linux/amd64, linux/arm64, darwin/amd64, darwin/arm64,
          windows/amd64, windows/arm64, freebsd/amd64, plus \`checksums.txt\`.

          ### Manual install (example: qoderwork linux/amd64)
          \`\`\`bash
          unzip qoderwork_${VERSION}_linux_amd64.zip
          cp qoderwork.so /path/to/cliproxyapi/plugins/qoderwork.so
          \`\`\`

          \`\`\`yaml
          plugins:
            enabled: true
            dir: "plugins"
            configs:
              workbuddy:
                enabled: true
              qoderwork:
                enabled: true
          \`\`\`

          ### Remote update (custom plugin source)
          Add to CPA plugin store sources:
          \`\`\`
          https://raw.githubusercontent.com/Sliverkiss/cpa-plugin/main/registry.json
          \`\`\`
          Then install / update **workbuddy** and **qoderwork** from the store UI.
          EOF
          )
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.zip dist/checksums.txt --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" dist/*.zip dist/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --title "CPA plugins ${TAG}" \
              --notes "${NOTES}"
          fi
